# 由 Runner 根据 plugin.py 的 config_model 生成；这是示例文件，复制为 config.toml 也可用。
# 注意：[plugin] 节由 MaiBot Runner 维护，不能删除，config_version 必须存在。

[plugin]
enabled = true
config_version = "1.0.0"

[server]
host = "mc.example.com"       # 只填域名即可；也可写 域名:端口
port = 0                     # 0 = 自动：域名有 SRV 记录就跟随，否则 25565
minecraft_version = "26.2"    # auto / 26.2 / 1.20.1
username = "MaiBot"
auth = "offline"            # offline / microsoft
microsoft_client_id = "00000000402b5328"
auth_cache = ""             # 留空 = ~/.maibot-mc/auth.json
view_distance = 8
auto_connect = false        # 插件加载后自动进服
reconnect_delay = 8.0
max_reconnect = 5

[behavior]
autonomous = true           # 没人指挥时自己砍树/挖矿/打怪/闲逛
auto_eat = true
humanize = true
chat_reply = true
chat_reply_cooldown = 8.0
chat_reply_probability = 0.75
reaction_base = 0.2
typing_cps = 5.5

[llm]
llm_enabled = true          # 关掉也能用规则回复与规则行为
llm_model = ""
llm_task = ""
persona = "你是麦麦，一个正在玩《我的世界》的普通玩家。你说话简短、口语化、偶尔用颜文字，会像真人一样吐槽、分享自己在挖矿/盖房子/打怪时的见闻。不要提自己是 AI 或程序，不要长篇大论，每次回复不超过 40 个字。"

[report]
report_stream_id = ""       # 留空 = 最近一次对话的聊天流
report_chat = true
report_death = true
report_prefix = "[MC]"

[verify]
# 首次进服时加载界面（标题/动作栏/聊天）出现验证码，自动转发到 QQ 群
verify_enabled = true
verify_stream_id = ""       # 验证群；留空复用 report_stream_id / 最近会话
verify_pattern = ""         # 自定义正则，留空自动识别
verify_template = "[MC] 进服验证码：{code}"
verify_window = 180.0       # 进服后监听秒数，0 = 一直监听
verify_forward_source = false

[security]
# 允许使用 /mc 的用户，逗号分隔。MaiBot 1.3.x 没有命令级权限，靠这里校验；
# 1.4+ 仍会叠加 MaiBot 自己的操作员权限。
admin_users = ""            # 例如 "qq:123456789,telegram:987654321"
